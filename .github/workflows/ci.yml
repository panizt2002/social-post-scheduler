name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scheduler
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scheduler"
          --health-interval 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  publisher-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B package

  docker-images:
    needs: [api-tests, publisher-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/post-scheduler-api:latest api
          docker build -t ghcr.io/${{ github.repository_owner }}/post-scheduler-publisher:latest publisher
      - name: Push images to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/post-scheduler-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/post-scheduler-publisher:latest
